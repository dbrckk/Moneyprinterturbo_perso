name: CLIP Local CPU Inference Smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  push:
    paths:
      - semantic/**
      - semantic_rank.py
      - .github/workflows/clip-smoke.yml
  pull_request:
    paths:
      - semantic/**
      - semantic_rank.py
      - .github/workflows/clip-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional standalone CLIP runtime
        run: npm install --prefix semantic --no-audit --no-fund
      - name: Validate CLIP adapter with no model download
        run: node --test semantic/test_clip_rank.mjs
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: .clip-cache
          key: mpt-clip-q8-xenova-6ef1ebc-v1
      - name: Install FFmpeg when unavailable
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Create two local image candidates
        shell: bash
        run: |
          ffmpeg -hide_banner -nostdin -loglevel error -y -f lavfi -i testsrc2=s=224x224:r=1 -frames:v 1 -update 1 /tmp/mpt-clip-one.png
          ffmpeg -hide_banner -nostdin -loglevel error -y -f lavfi -i smptebars=s=224x224:r=1 -frames:v 1 -update 1 /tmp/mpt-clip-two.png
          python - <<'PY'
          import json
          from pathlib import Path
          Path('clip-input.json').write_text(json.dumps({'candidates': [
              {'id': 0, 'path': '/tmp/mpt-clip-one.png', 'prompt': 'mountain'},
              {'id': 1, 'path': '/tmp/mpt-clip-two.png', 'prompt': 'forest'}
          ]}))
          PY
      - name: Run real CPU ONNX zero-shot inference with pinned model revision
        env:
          MPT_CLIP_CACHE_DIR: ${{ github.workspace }}/.clip-cache
        run: node semantic/clip_rank.mjs clip-input.json clip-output.json
      - name: Assert real finite inference scores and model identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('clip-output.json').read_text())
          assert result['model']=='Xenova/clip-vit-base-patch32'
          scores=result['scores']
          assert len(scores)==2 and [row['id'] for row in scores]==[0,1]
          assert all(0 <= row['score'] <= 1 for row in scores)
          print('Validated two real local CLIP inferences:', scores)
          PY
      - name: Validate Python selection bridge with actual CLIP model
        env:
          MPT_CLIP_CACHE_DIR: ${{ github.workspace }}/.clip-cache
        run: |
          python - <<'PY'
          from pathlib import Path
          from media_assets import MediaAsset
          from semantic_rank import rerank
          sample = [
              MediaAsset(Path('/tmp/mpt-clip-one.png'), 'image',
                'https://commons.wikimedia.org/wiki/File:example-a.png',
                'CC0', 'Example', 'forest a',
                query_term_count=1, query_term_coverage=1.0),
              MediaAsset(Path('/tmp/mpt-clip-two.png'), 'image',
                'https://commons.wikimedia.org/wiki/File:example-b.png',
                'CC0', 'Example', 'forest b',
                query_term_count=1, query_term_coverage=1.0),
          ]
          ranked, stats, warnings = rerank({'forest': (sample, [], {})}, Path.cwd())
          assert stats['semantic_status'] == 'ok', (stats, warnings)
          assert stats['semantic_candidate_count'] == 2
          assert all(row.semantic_score is not None for row in ranked['forest'][0])
          print('Python bridge and metadata verified:', stats)
          PY
