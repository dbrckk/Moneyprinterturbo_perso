name: Générer une vidéo gratuite
run-name: "Free Studio · ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifiant du studio web (laisser vide depuis GitHub)
        required: false
        type: string
        default: ""
      topic:
        description: Sujet de la vidéo
        required: true
        type: string
        default: Les économies d'énergie
      script_mode:
        description: "Mode scénario : modèle fixe ou IA locale Ollama (CPU sur GitHub)"
        required: true
        type: choice
        options: [template, local-ai]
        default: template
      script:
        description: Narration personnalisée facultative (sans IA si vide)
        required: false
        type: string
        default: ''
      scene_queries:
        description: Recherche par scène, facultative (ex. foret|riviere) ; une entrée par phrase
        required: false
        type: string
        default: ''
      voice:
        description: Voix gratuite (Piper neuronal actuellement en français uniquement)
        required: true
        type: choice
        options: [espeak, piper-fr-siwis]
        default: espeak
      speech_rate:
        description: Vitesse de la voix eSpeak uniquement (mots/minute)
        required: true
        type: choice
        options: ['120', '145', '170']
        default: '145'
      visuals:
        description: Visuels gratuits (Commons = domaine public/CC0, repli garanti)
        required: true
        type: choice
        options: [commons, abstract]
        default: commons
      lang:
        description: Langue et voix
        required: true
        type: choice
        options: [fr, en, es, de, it, pt]
        default: fr
      aspect:
        description: Format vidéo
        required: true
        type: choice
        options: ['9:16', '16:9', '1:1']
        default: '9:16'
      resolution:
        description: Résolution du petit côté en pixels
        required: true
        type: choice
        options: ['360', '720', '1080']
        default: '720'
permissions:
  contents: read
jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free render dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - name: Install Ollama only for local AI scripts
        if: ${{ inputs.script_mode == 'local-ai' && inputs.script == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Official Linux package; avoids executing a remotely fetched shell installer.
          curl --fail --show-error --silent --location --retry 3 \
            'https://ollama.com/download/ollama-linux-amd64.tar.zst' -o /tmp/ollama.tar.zst
          sudo apt-get install -y zstd
          sudo tar --use-compress-program=zstd -xf /tmp/ollama.tar.zst -C /usr
          OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/mpt-ollama.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            if [[ "$attempt" -eq 45 ]]; then tail -60 /tmp/mpt-ollama.log; exit 1; fi
            sleep 2
          done
          ollama pull qwen2.5:1.5b
      - name: Install and validate neural French voice (only when selected)
        if: ${{ inputs.voice == 'piper-fr-siwis' }}
        shell: bash
        env:
          LANG_SELECTION: ${{ inputs.lang }}
        run: |
          set -euo pipefail
          if [[ "$LANG_SELECTION" != "fr" ]]; then echo 'Piper SIWIS supports French only.' >&2; exit 1; fi
          python -m pip install --disable-pip-version-check 'piper-tts==1.8.0'
          mkdir -p models
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/d5de91c972ba5a13cea0e77a63fda1623faac2c1/fr/fr_FR/siwis/medium'
          curl --fail --show-error --silent --location --retry 3 --max-time 300 \
            "$BASE/fr_FR-siwis-medium.onnx" -o models/fr_FR-siwis-medium.onnx
          curl --fail --show-error --silent --location --retry 3 --max-time 90 \
            "$BASE/fr_FR-siwis-medium.onnx.json" -o models/fr_FR-siwis-medium.onnx.json
          echo '641d1ab097da2b81128c076810edb052b385decc8be3381814802a64a73baf99  models/fr_FR-siwis-medium.onnx' | sha256sum --check --status
          python -c "import json; from pathlib import Path; d=json.loads(Path('models/fr_FR-siwis-medium.onnx.json').read_text()); assert d['language']['code']=='fr_FR'"
          command -v piper
      - name: Generate actual narrated MP4
        env:
          TOPIC: ${{ inputs.topic }}
          LANG: ${{ inputs.lang }}
          ASPECT: ${{ inputs.aspect }}
          RESOLUTION: ${{ inputs.resolution }}
          SCRIPT_TEXT: ${{ inputs.script }}
          SCRIPT_MODE: ${{ inputs.script_mode }}
          VISUAL_MODE: ${{ inputs.visuals }}
          SCENE_QUERIES: ${{ inputs.scene_queries }}
          SPEECH_RATE: ${{ inputs.speech_rate }}
          VOICE: ${{ inputs.voice }}
        run: |
          ARGS=(--topic "$TOPIC" --lang "$LANG" --aspect "$ASPECT" --resolution "$RESOLUTION" --speech-rate "$SPEECH_RATE" --output outputs/video.mp4)
          if [[ -n "$SCRIPT_TEXT" ]]; then
            if [[ "$SCRIPT_MODE" == "local-ai" ]]; then
              echo 'A custom script and local AI mode cannot be combined' >&2; exit 1
            fi
            ARGS+=(--script "$SCRIPT_TEXT")
          elif [[ "$SCRIPT_MODE" == "local-ai" ]]; then
            ARGS+=(--ollama-model qwen2.5:1.5b --ollama-url http://127.0.0.1:11434)
          fi
          if [[ "$VOICE" == "piper-fr-siwis" ]]; then
            if [[ "$LANG" != "fr" ]]; then echo 'Piper SIWIS only supports fr.' >&2; exit 1; fi
            ARGS+=(--tts piper --piper-model models/fr_FR-siwis-medium.onnx)
          elif [[ "$VOICE" != "espeak" ]]; then
            echo 'Unknown speech engine' >&2; exit 1
          fi
          if [[ "$VISUAL_MODE" == "commons" ]]; then ARGS+=(--commons); fi
          if [[ -n "$SCENE_QUERIES" ]]; then ARGS+=(--scene-queries "$SCENE_QUERIES"); fi
          python free_studio.py "${ARGS[@]}"
      - name: Verify output contains video and audio streams
        run: |
          test -s outputs/video.mp4
          test -s outputs/video.srt
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 outputs/video.mp4 | grep -q '^h264$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 outputs/video.mp4 | grep -q '^aac$'
      - name: Downloadable MP4
        uses: actions/upload-artifact@v4
        with:
          name: free-studio-video
          path: |
            outputs/video.mp4
            outputs/video.json
            outputs/video.srt
            outputs/video.credits.txt
          retention-days: 7
          if-no-files-found: error
