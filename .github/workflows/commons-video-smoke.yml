name: Wikimedia Commons Real Video Smoke
on:
  push:
    paths:
      - media_assets.py
      - free_studio.py
      - .github/workflows/commons-video-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commons-video:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check FFmpeg and eSpeak
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1 || ! command -v espeak >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg espeak
          fi
      - name: Render genuine CC0/public-domain Commons scene material into a video
        run: |
          python free_studio.py --topic "Paysages français" --commons             --scene-queries 'montagne|rivière'             --script 'Une montagne s élève devant nous. La rivière traverse un paysage magnifique.'             --lang fr --aspect '9:16' --resolution 360 --fps 12             --output outputs/commons-real.mp4
      - name: Validate actual MP4, SRT, provenance and fallback state
        run: |
          python video_qa.py outputs/commons-real.mp4
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          video=Path('outputs/commons-real.mp4')
          meta=json.loads(video.with_suffix('.json').read_text())
          quality=json.loads(video.with_suffix('.quality.json').read_text())
          assert quality['ok'], quality['errors']
          assert meta['commons_fetch']['unique_queries']==2
          assert meta['commons_fetch']['contextual_expansions']==2
          assert meta['duration_seconds']>2
          for asset in meta['media']:
              assert asset['license'].lower() in ('cc0','cc0 1.0','public domain','pd-old','pd-self','pd-us','pd-art')
              assert asset['source'].startswith('https://commons.wikimedia.org/')
          found=len(meta['media'])
          status='ACTUAL VERIFIED MEDIA' if found else 'GRAPHIC FALLBACK; NETWORK MEDIA UNAVAILABLE'
          print(status, found, 'scenes, wall',meta['commons_fetch']['wall_seconds'],'seconds')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'## Commons real-video smoke\n\nStatus: **{status}**\n\n')
              summary.write(f'Verified Commons scenes: **{found}/2**\n\n')
              summary.write(f'Commons elapsed: **{meta["commons_fetch"]["wall_seconds"]} seconds**\n')
          PY
      - name: Test repeated scenery scenes with a single Commons search
        shell: bash
        run: |
          python free_studio.py --topic 'Montagnes' --commons \
            --scene-queries 'montagne|montagne|montagne' \
            --script 'Voici une chaîne de montagnes. Le sommet domine la vallée. Un autre panorama se découvre.' \
            --mute --lang fr --aspect '9:16' --resolution 360 --fps 12 \
            --output outputs/commons-diverse.mp4
          python video_qa.py outputs/commons-diverse.mp4
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          video=Path('outputs/commons-diverse.mp4')
          report=json.loads(video.with_suffix('.json').read_text())
          stats=report['commons_fetch']
          quality=json.loads(video.with_suffix('.quality.json').read_text())
          assert quality['ok'], quality['errors']
          assert len(report['segments'])==3
          assert stats['unique_queries']==1
          assert stats['image_variants_budget']==3
          assert 0<=stats['image_variants_fetched']<=3
          assert stats['scenes_matched']==len(report['media'])
          urls={entry['source'] for entry in report['media']}
          assert len(urls)==stats['unique_images_selected']
          assert stats['scenes_reusing_image']==len(report['media'])-len(urls)
          assert 0<=stats['scenes_reusing_image']<=3
          assert all(entry['license'].lower() in ('cc0','cc0 1.0','public domain','pd-old','pd-self','pd-us','pd-art') for entry in report['media'])
          print('REPEATED COMMONS SCENES:',len(report['media']),'matched;',
                len(urls),'distinct image files;',stats['image_variants_fetched'],'downloaded candidates')
          print('Fallback scenes:',3-len(report['media']))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('\\n## Repeated-topic visual diversity\\n\\n')
              summary.write(f'Commons searches: **{stats["unique_queries"]}**\\n\\n')
              summary.write(f'Actual distinct image sources: **{len(urls)}**\\n\\n')
              summary.write(f'Graphic fallback scenes: **{3-len(report["media"])}**\\n\\n')
          PY
      - name: Attach actual video, storyboard, subtitles and network timings
        uses: actions/upload-artifact@v4
        with:
          name: verified-commons-video-sample
          path: |
            outputs/commons-real.mp4
            outputs/commons-real.json
            outputs/commons-real.srt
            outputs/commons-real.ass
            outputs/commons-real.quality.json
            outputs/commons-real.storyboard.png
            outputs/commons-real.credits.txt
            outputs/commons-diverse.mp4
            outputs/commons-diverse.json
            outputs/commons-diverse.srt
            outputs/commons-diverse.ass
            outputs/commons-diverse.quality.json
            outputs/commons-diverse.storyboard.png
            outputs/commons-diverse.credits.txt
          retention-days: 3
          if-no-files-found: error
