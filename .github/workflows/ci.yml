name: Free Studio CI
on:
  push:
    paths:
      - free_studio.py
      - media_assets.py
      - tests/**
      - .github/workflows/ci.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free render dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - name: Static compilation
        run: python -m compileall -q free_studio.py media_assets.py tests
      - name: Real audio and video smoke tests
        run: python -m unittest discover -s tests -v
      - name: Render reviewable French sample
        run: |
          python free_studio.py \
            --speech-rate 145 \
            --topic "Réduire la consommation d'énergie" \
            --script "Débranchez les appareils que vous n'utilisez pas. Ajustez le chauffage à vos besoins. Comparez les consommations avant de remplacer un équipement." \
            --lang fr --resolution 360 --fps 12 --output outputs/ci-preview.mp4
      - name: Check editable subtitles and metadata
        run: |
          test -s outputs/ci-preview.srt
          test -s outputs/ci-preview.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 outputs/ci-preview.mp4 | grep -q '^h264$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 outputs/ci-preview.mp4 | grep -q '^aac$'
      - name: Attach real preview video for visual review
        uses: actions/upload-artifact@v4
        with:
          name: free-studio-ci-preview
          path: |
            outputs/ci-preview.mp4
            outputs/ci-preview.json
            outputs/ci-preview.srt
          retention-days: 7
          if-no-files-found: error
