name: Free Studio CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  push:
    branches:
      - main
    paths:
      - free_studio.py
      - publish_bundle.py
      - workflow_preflight.py
      - tests/test_audio_mastering.py
      - tests/test_audio_activity.py
      - xfade_final.py
      - fast_abstract.py
      - fast_media.py
      - scene_framing.py
      - tts_batch.py
      - cinematic.py
      - caption_motion.py
      - forced_alignment.py
      - video_qa.py
      - media_assets.py
      - capture_order.py
      - shot_quality.py
      - video_timeline.py
      - semantic_rank.py
      - visual_benchmark.py
      - .github/workflows/clip-ab-benchmark.yml
      - semantic/**
      - visual_hash.py
      - .github/workflows/free-video.yml
      - studio_server.py
      - web/**
      - tests/**
      - .github/workflows/ci.yml
      - remote/**
      - tests/test_remote_core.mjs
      - tests/test_remote_files.py
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render tools only if missing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ffmpeg ffprobe espeak; do
            if ! command -v "$name" >/dev/null 2>&1; then
              if [[ "$name" == "ffprobe" ]]; then
                [[ " ${missing[*]} " == *" ffmpeg "* ]] || missing+=(ffmpeg)
              else
                missing+=("$name")
              fi
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          ffmpeg -hide_banner -version | head -1
          espeak --version | head -1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript and remote API contracts
        run: |
          node --check remote/core.mjs
          node --check remote/main.mjs
          node --check remote/downloads.mjs
          node --check remote/offline_cache.mjs
          node --check remote/draft_backup.mjs
          node --check remote/sw.mjs
          node --check remote/run_lifecycle.mjs
          node --check semantic/clip_rank.mjs
          node --check review_mobile.js
          node --test tests/test_review_mobile.mjs
          node --test semantic/test_clip_rank.mjs
          node --test tests/test_remote_core.mjs tests/test_downloads.mjs tests/test_offline_cache.mjs tests/test_draft_backup.mjs tests/test_run_lifecycle.mjs
      - name: Static compilation
        run: python -m compileall -q shot_quality.py capture_order.py scene_framing.py fast_media.py fast_abstract.py free_studio.py video_timeline.py publish_bundle.py workflow_preflight.py tts_batch.py xfade_final.py cinematic.py caption_motion.py forced_alignment.py media_assets.py visual_hash.py semantic_rank.py visual_benchmark.py video_qa.py studio_server.py tests
      - name: Validate browser JavaScript syntax
        run: node --check web/app.js
      - name: Real audio and video smoke tests
        run: python -m unittest discover -s tests -v
      - name: Render reviewable French sample
        run: |
          python free_studio.py \
            --speech-rate 145 \
            --topic "Réduire la consommation d'énergie" \
            --script "Débranchez les appareils que vous n'utilisez pas. Ajustez le chauffage à vos besoins. Comparez les consommations avant de remplacer un équipement." \
            --lang fr --resolution 360 --fps 12 --output outputs/ci-preview.mp4
      - name: Check editable subtitles and metadata
        run: |
          test -s outputs/ci-preview.srt
          test -s outputs/ci-preview.ass
          test -s outputs/ci-preview.json
          python -c "import json; assert json.load(open('outputs/ci-preview.json'))['visual_style']=='cinematic'"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 outputs/ci-preview.mp4 | grep -q '^h264$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 outputs/ci-preview.mp4 | grep -q '^aac$'
      - name: Verify delivery quality and export scene contact sheet
        run: python video_qa.py outputs/ci-preview.mp4
      - name: Validate direct storyboard PNG upload on GitHub Actions v7
        uses: actions/upload-artifact@v7
        with:
          path: outputs/ci-preview.storyboard.png
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Validate non-ZIP MP4 upload on GitHub Actions v7
        uses: actions/upload-artifact@v7
        with:
          path: outputs/ci-preview.mp4
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Validate non-ZIP SRT upload on GitHub Actions v7
        uses: actions/upload-artifact@v7
        with:
          path: outputs/ci-preview.srt
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Validate non-ZIP QA JSON upload on GitHub Actions v7
        uses: actions/upload-artifact@v7
        with:
          path: outputs/ci-preview.quality.json
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Verify provenance and scene manifest exist for Android publishing
        run: |
          test -s outputs/ci-preview.credits.txt
          test -s outputs/ci-preview.json
          grep -q 'ASSET & VOICE CREDITS' outputs/ci-preview.credits.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/ci-preview.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert len(data['segments']) >= 1
          assert data['audio_mastering'] is not None
          assert data['speech'] is True
          PY
      - name: Verify unzipped TXT credits upload on GitHub Actions v7
        uses: actions/upload-artifact@v7
        with:
          path: outputs/ci-preview.credits.txt
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Verify unzipped JSON scene manifest upload on GitHub Actions v7
        uses: actions/upload-artifact@v7
        with:
          path: outputs/ci-preview.json
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Attach real preview video for visual review
        uses: actions/upload-artifact@v4
        with:
          name: free-studio-ci-preview
          path: |
            outputs/ci-preview.mp4
            outputs/ci-preview.json
            outputs/ci-preview.srt
            outputs/ci-preview.ass
            outputs/ci-preview.quality.json
            outputs/ci-preview.storyboard.png
          retention-days: 7
          if-no-files-found: error
