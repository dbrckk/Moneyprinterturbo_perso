name: Media Pipeline Speed Comparison
on:
  push:
    paths:
      - fast_media.py
      - free_studio.py
      - bench/compare_media_pipeline.py
      - tests/test_fast_media.py
      - .github/workflows/media-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure FFmpeg and eSpeak
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe || ! command -v espeak; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg espeak
          fi
      - name: Compare matching 720p and 1080p JPEG/MP4 renders
        run: python bench/compare_media_pipeline.py
      - name: Upload results and visual contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: jpeg-mp4-onepass-comparison
          path: |
            outputs/benchmarks/media/comparison.json
            outputs/benchmarks/media/*.quality.json
            outputs/benchmarks/media/*.storyboard.png
          retention-days: 7
          if-no-files-found: error
